[project]
name = "jwpoint"
dynamic = ["version"]
description = "Pointing utils for JWST"
readme = "README.md"
authors = [{ name = "Thomas Vandal", email = "thomas.vandal@umontreal.ca" }]
requires-python = ">=3.11"
dependencies = ["matplotlib", "numpy", "jwst", "scipy", "stdatamodels"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/jwpoint/_version.py"

[dependency-groups]
dev = ["ipython", { include-group = "docs" }]
docs = [
  "ipykernel>=7.3.0",
  "mastodown",
  "myst-nb>=1.4.0",
  "myst-parser>=5.1.0",
  "sphinx>=9.0.4",
  "sphinx-autodoc-typehints>=3.6.1",
  "sphinx-book-theme>=1.4.0",
]
