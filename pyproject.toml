[project]
name = "jwpoint"
dynamic = ["version"]
description = "Pointing utils for JWST"
readme = "README.md"
authors = [
    { name = "Thomas Vandal", email = "thomas.vandal@umontreal.ca" }
]
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "numpy",
  "jwst",
  "scipy",
  "stdatamodels",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/jwpoint/_version.py"
